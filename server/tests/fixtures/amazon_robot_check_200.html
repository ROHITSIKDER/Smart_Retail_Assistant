<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<title>Robot Check</title>
</head>
<body>
<div class="a-container a-padding-double-large" style="min-width:500px;margin: 0 auto;">
  <div class="a-row a-spacing-double-large">
    <div class="a-box a-alert a-alert-info a-spacing-base">
      <div class="a-box-inner">
        <h4>Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</h4>
      </div>
    </div>
    <div class="a-section">
      <form method="get" action="/errors/validateCaptcha" name="">
        <input type=hidden name="amzn" value="abcdef123456" />
        <div class="a-row a-spacing-large">
          <div class="a-box">
            <div class="a-box-inner">
              <h4>Type the characters you see in this image:</h4>
              <img src="https://images-na.ssl-images-amazon.com/captcha/usbfgtyh/Captcha_abcdef.jpg">
              <input autocomplete="off" spellcheck="false" name="field-keywords" type="text">
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
