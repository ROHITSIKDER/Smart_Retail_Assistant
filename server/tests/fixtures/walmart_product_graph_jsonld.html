<!DOCTYPE html>
<html>
<head>
  <title>Walmart Product with @graph JSON-LD</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebPage",
        "name": "Product Page"
      },
      {
        "@type": "Product",
        "name": "Ninja Professional Countertop Blender",
        "brand": { "@type": "Brand", "name": "Ninja" },
        "offers": {
          "@type": "Offer",
          "price": "79.99",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.7"
        },
        "image": "https://i5.walmartimages.com/asr/example.jpeg",
        "review": [
          { "reviewBody": "Crushes ice smoothly into snow in just a few pulses." },
          { "reviewBody": "Pitcher is very durable and easy to wash in dishwasher." },
          { "reviewBody": "Makes morning smoothies consistently smooth without pulp chunks." }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <h1 data-testid="product-title">Ninja Professional Countertop Blender</h1>
</body>
</html>
