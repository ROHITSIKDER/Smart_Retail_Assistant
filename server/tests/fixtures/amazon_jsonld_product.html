<!DOCTYPE html>
<html>
<head>
  <title>Amazon Product with Structured Data</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Apple MacBook Air 15-inch M3",
    "brand": { "@type": "Brand", "name": "Apple" },
    "offers": {
      "@type": "Offer",
      "price": "1299.00",
      "priceCurrency": "USD"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8"
    },
    "image": "https://m.media-amazon.com/images/I/71S4sIPFvBL._AC_SL1500_.jpg",
    "review": [
      { "@type": "Review", "reviewBody": "Incredible battery life and the larger display is a huge upgrade." },
      { "@type": "Review", "reviewBody": "Super silent operation without fans and blazing fast performance." },
      { "@type": "Review", "reviewBody": "Lightweight body with premium build quality and sharp Retina display." }
    ]
  }
  </script>
</head>
<body>
  <h1 class="a-size-large">Apple MacBook Air 15-inch M3</h1>
</body>
</html>
